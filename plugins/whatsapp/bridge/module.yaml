# Machine-readable module manifest. Agents parse this to map the repo; keep it in sync with go.mod.
id: bridge
type: service
purpose: >
  Long-running WhatsApp linked device (whatsmeow). Stores every chat's name and activity time, and message
  content only for allowlisted chats (fetching a chat's last 50 messages from the phone when it is added); serves a loopback-only, token-authenticated API for sends and media
  downloads, refusing files outside the send_from folders; a Touch ID-approved send to an unlisted chat adds it. Hardened fork of lharries/whatsapp-mcp.
  Sends to anyone but the owner wait for the owner's Touch ID (the WhatsApp for Claude helper), except notification chats that can
  only reach the owner.
  Decisions: ADR 2026-10-23-de419c, ADR 2026-10-23-e302a3, ADR 2026-10-23-f28675, ADR 2026-10-27-a8ea3b,
  A pattern the owner arms with Touch ID ahead of time lets matching text sends to that chat go out unattended.
  ADR 2026-10-27-17d63a, ADR 2026-10-27-16abb6, ADR 2026-10-30-032c66.
consumes:
  - go.mau.fi/whatsmeow           # WhatsApp multi-device protocol
  - github.com/mattn/go-sqlite3   # message store (cgo)
  - rsc.io/qr                     # QR PNG for pairing
language: go
runtime:
  go: ">=1.26"                    # exact toolchain in go.mod
data_dir: "$WA_HOME (default ~/.whatsapp-mcp)"
interfaces:
  - "POST 127.0.0.1:<port>/api/send      {recipient, message, media_path?}  Bearer token, application/json"
  - "POST 127.0.0.1:<port>/api/download  {message_id, chat_jid}             Bearer token, application/json"
  - "POST 127.0.0.1:<port>/api/command   {command}                        Bearer token, application/json; posts #wa <command> to the first notification chat (else the self-chat)"
  - "POST 127.0.0.1:<port>/api/approve-test {}                             Bearer token, application/json; one Touch ID prompt, nothing sent"
  - "POST 127.0.0.1:<port>/api/arm      {recipient, pattern, for?, times?} Bearer token, application/json; Touch ID, then text sends matching the pattern skip the prompt"
  - "POST 127.0.0.1:<port>/api/armed    {}                               Bearer token, application/json; lists armed patterns"
  - "POST 127.0.0.1:<port>/api/disarm   {recipient?, id?}                 Bearer token, application/json; drops armed patterns (all with neither)"
  - "runs ./WhatsApp for Claude (next to the bridge binary) for owner approval"
  - "reads #wa commands sent by the owner in their own chat; applies them to config.json"
  - "writes messages.db (chats, chat_anchors, messages) read by server"
  - "asks the owner's phone for a chat's recent history when the chat is added by a live command"
guard_files:
  - ./config.go
  - ./selfcmd.go
  - ./approve.go
  - ./armed.go
docs:
  readme: ./README.md
  design: ../../../docs/architecture/decisions/2026-10-23-e302a3-allowlist-gates-content-and-sends.md
  security: ../../../docs/architecture/security-model.md
commands:
  build: "go build -o whatsapp-bridge ."
  test: "go test ./..."
  lint: "gofmt -l . && go vet ./..."
  run: "./whatsapp-bridge [-pair-phone <digits>]"
owners:
  - utkarsh9891
